name: musl-build

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'web/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/musl-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Add rust musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: musl-x86_64
          cache-on-failure: true

      - name: Build musl release
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --target x86_64-unknown-linux-musl \
            --bin zhuanfa-master --bin zhuanfa-node

      - name: Verify static linkage
        run: |
          strip target/x86_64-unknown-linux-musl/release/zhuanfa-master
          strip target/x86_64-unknown-linux-musl/release/zhuanfa-node
          ls -lh target/x86_64-unknown-linux-musl/release/zhuanfa-{master,node}
          file target/x86_64-unknown-linux-musl/release/zhuanfa-master
          file target/x86_64-unknown-linux-musl/release/zhuanfa-node

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zhuanfa-musl-x86_64
          path: |
            target/x86_64-unknown-linux-musl/release/zhuanfa-master
            target/x86_64-unknown-linux-musl/release/zhuanfa-node
          retention-days: 14
          if-no-files-found: error
