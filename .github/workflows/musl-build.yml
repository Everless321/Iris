name: musl-build

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'web/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/musl-build.yml'
  workflow_dispatch:

permissions:
  contents: write   # 自动覆盖 rolling release 所需

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          # 全历史：build.rs 用 git log -1 -- <path> 算"最后改 node 相关代码的 commit",
          # 让 UI/master-only 改动不刷 node 版本号。
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        # rollup linux-x64-gnu 已显式列在 optionalDependencies，无论 lock 在哪生成都能装
        # 不传 --no-audit：让 high-severity 漏洞失败 CI（supply-chain 防护）
        run: |
          npm ci --include=optional --no-fund
          npm run build

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Add rust musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: musl-x86_64
          cache-on-failure: true

      - name: Build musl release
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --target x86_64-unknown-linux-musl \
            --bin iris-master --bin iris-node

      - name: Verify static linkage
        run: |
          strip target/x86_64-unknown-linux-musl/release/iris-master
          strip target/x86_64-unknown-linux-musl/release/iris-node
          ls -lh target/x86_64-unknown-linux-musl/release/iris-{master,node}
          file target/x86_64-unknown-linux-musl/release/iris-master
          file target/x86_64-unknown-linux-musl/release/iris-node

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iris-musl-x86_64
          path: |
            target/x86_64-unknown-linux-musl/release/iris-master
            target/x86_64-unknown-linux-musl/release/iris-node
          retention-days: 14
          if-no-files-found: error

      # 仅 main push 时自动覆盖 rolling release。资产名与 README/install-node.sh
      # 期望的 iris-{master,node}-musl-x86_64 一致；标记 make_latest=true 让
      # `releases/latest/download/...` URL 永远命中最新 main build。
      - name: Stage rolling release assets
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cp target/x86_64-unknown-linux-musl/release/iris-master ./iris-master-musl-x86_64
          cp target/x86_64-unknown-linux-musl/release/iris-node   ./iris-node-musl-x86_64

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        # Pinned to full commit SHA (security: prevents tag-hijack supply-chain attack).
        # To bump: gh api repos/softprops/action-gh-release/git/refs/tags/v2.X.Y --jq '.object.sha'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: rolling
          name: "Rolling (auto-built from main)"
          body: |
            Auto-built from `main` on every push — assets are overwritten in place.
            Commit: ${{ github.sha }}
            For pinned stable versions, use a versioned tag (e.g. `v0.1.0`).
          prerelease: false
          make_latest: "true"
          files: |
            iris-master-musl-x86_64
            iris-node-musl-x86_64
