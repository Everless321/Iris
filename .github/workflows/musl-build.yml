name: musl-build

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'web/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/musl-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        # rollup linux-x64-gnu 已显式列在 optionalDependencies，无论 lock 在哪生成都能装
        # 不传 --no-audit：让 high-severity 漏洞失败 CI（supply-chain 防护）
        run: |
          npm ci --include=optional --no-fund
          npm run build

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Add rust musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: musl-x86_64
          cache-on-failure: true

      - name: Build musl release
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --target x86_64-unknown-linux-musl \
            --bin iris-master --bin iris-node

      - name: Verify static linkage
        run: |
          strip target/x86_64-unknown-linux-musl/release/iris-master
          strip target/x86_64-unknown-linux-musl/release/iris-node
          ls -lh target/x86_64-unknown-linux-musl/release/iris-{master,node}
          file target/x86_64-unknown-linux-musl/release/iris-master
          file target/x86_64-unknown-linux-musl/release/iris-node

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iris-musl-x86_64
          path: |
            target/x86_64-unknown-linux-musl/release/iris-master
            target/x86_64-unknown-linux-musl/release/iris-node
          retention-days: 14
          if-no-files-found: error
