[package]
name = "iris-node"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "iris-node"
path = "src/main.rs"

[dependencies]
iris-proto = { path = "../proto" }
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
socket2 = { version = "0.5", features = ["all"] }
# Phase 9a raw_tunnel：直接 rustls，绕过 tonic + HTTP/2 framing
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "tls12", "std"] }
rustls-pemfile = "2"
prost = { workspace = true }
# Phase 9c quic_tunnel：UDP 走 QUIC datagram 解决 UDP-over-TCP 丢包根因
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
bytes = "1"
