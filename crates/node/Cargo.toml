[package]
name = "iris-node"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "iris-node"
path = "src/main.rs"

[dependencies]
iris-proto = { path = "../proto" }
iris-common = { path = "../common" }
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
socket2 = { version = "0.5", features = ["all"] }
# Phase 9a raw_tunnel：直接 rustls，绕过 tonic + HTTP/2 framing
# crypto backend 切 aws-lc-rs（基于 BoringSSL，AES-NI 优化更好；rustls 默认 ring 单核 AES 慢 20-30%）
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "tls12", "std"] }
rustls-pemfile = "2"
prost = { workspace = true }
# Phase 9c quic_tunnel：UDP 走 QUIC datagram 解决 UDP-over-TCP 丢包根因
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"] }
bytes = "1"
uuid = { version = "1", features = ["v4"] }
# #39 token-bucket 速率限制（per-forward in/out 独立 bucket，read/write 前 await ready）
governor = "0.6"
# M4 fastpath capability JSON 序列化 + nft -j list ruleset 解析
serde = { workspace = true }
serde_json = { workspace = true }
# M7 节点资源监控：CPU/RAM/disk/load/network/uptime 等
sysinfo = { version = "0.32", default-features = false, features = ["system", "disk", "network", "component"] }
# M8 agent 远程升级：sha256 校验
sha2 = "0.10"
hex = "0.4"

# M7.2 splice(2) 零拷贝单跳 fastpath（Linux only；其他平台走 copy_bidirectional 回退）
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
