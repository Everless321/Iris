syntax = "proto3";
package control;

// 主控 <-> 节点 控制面
service Control {
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatReply);
  // 节点拉取与自己相关的转发配置（P1 用 pull，P2/P3 升级为 push stream）
  rpc SyncConfig (SyncRequest) returns (SyncReply);
  // 节点 cert 临近过期主动续签：用现有 mTLS cert（仍有效）做客户端身份，
  // master 校验 peer cert CN == request.node_id 后用同一 CA 签发新 cert。
  rpc RenewCert (RenewCertRequest) returns (RenewCertReply);
  // M8 agent 远程升级：server-streaming，节点启动后保持长连，master 按需推 Command。
  // 客户端断流（mTLS 断 / 节点重启）时自然 GC。
  rpc Commands (CommandsRequest) returns (stream Command);
  // 节点回报命令执行进度（每阶段一次）。同 request_id 多次 ack 体现状态机推进。
  rpc AckCommand (CommandAck) returns (CommandAckReply);
}

// M8 命令推送 ---------------------------------------------------

message CommandsRequest {
  string node_id = 1;
}

// 主控下发的命令。oneof.kind 区分类型，预留 reload/restart 扩展。
message Command {
  string request_id = 1;       // master 生成 UUID，节点回 ack 用
  int64 issued_at_ms = 2;
  oneof kind {
    UpgradeCommand upgrade = 10;
  }
}

// 节点端升级请求。expected_sha256 由 master 算 release asset 时缓存，
// 节点下载完算 sha256 校验，不一致直接 abort（防中间人）。
// target_ref 空 = rolling latest；非空 = 指定 release tag（如 v0.2.0）。
message UpgradeCommand {
  string expected_sha256 = 1;
  string target_ref = 2;
}

// 节点 → master 命令状态回报。同 request_id 多次发送代表进度推进。
message CommandAck {
  string node_id = 1;
  string request_id = 2;
  CommandStatus status = 3;
  string detail = 4;          // success: 摘要；failed/rejected: 错误原因
  string stage = 5;           // "preflight" | "download" | "verify" | "swap" | "restart"
}

message CommandAckReply {}

enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  COMMAND_STATUS_RECEIVED = 1;
  COMMAND_STATUS_RUNNING = 2;
  COMMAND_STATUS_SUCCESS = 3;
  COMMAND_STATUS_FAILED = 4;
  COMMAND_STATUS_REJECTED = 5;  // preflight 失败：节点主动拒绝（不动旧 binary）
}

message HeartbeatRequest {
  string node_id = 1;
  uint64 seq = 2;
  double load = 3;
  // 本节点当前所有入口 forward 的 listener 实际状态。空 = 不是入口节点
  // 或者本周期未上报（向后兼容 — master 收到空时不更新已存视图）。
  repeated ListenerState listener_states = 4;
  // 仅入口节点统计：每条 forward 自 node 启动以来的累计字节数。
  // master 用 delta = current - last_reported 累加到持久化列；node 重启后 current 重置为 0,
  // master 检测到 current < last 时把 delta 设为 current（视作新 epoch）。
  repeated TrafficStat traffic_stats = 5;
  // 节点当前 mTLS client cert 的 NotAfter 毫秒时间戳。0 = 未知/老节点。
  // master 写入 nodes.cert_not_after_ms 供 UI 显示倒计时 + admin 排查续签状态。
  int64 cert_not_after_ms = 6;
  // 本周期内入口节点新增/活跃/关闭的 TCP 会话。节点保留 active session 直至下一轮上报，
  // closed 后再保留 1 轮（让 master 拿到 final bytes + close_reason）然后从节点删除。
  // master upsert by id：新 id INSERT，已知 id UPDATE bytes + closed_at + reason。
  repeated SessionEvent session_events = 7;
  // 节点对外宣告的数据面地址 host:port（用于节点间 mTLS 互联，写入 nodes.addr）。
  // 节点通常发 IRIS_DATA_ADDR 原文（如 "0.0.0.0:7444"）；master 检测到 host 是
  // wildcard / loopback 时用 peer 源 IP 替换。空 = 老节点，master 不更新 addr。
  string advertised_addr = 8;
  // M4 fast path 能力 JSON。例：{"fastpath":true,"kernel":"6.1.0","reason":"ok","in_container":false}
  // 空字符串 / 不存在 = 老节点不支持上报，master 视为 fastpath=false。
  string capabilities = 9;
  // M7 节点资源指标（CPU/RAM/disk/load/network/uptime 等）。
  // 不存在 = 老节点未上报，master UI 显示 "—"。每次心跳带，master 覆盖 latest
  // 表 + append 到 history 表（30s 采样保留 24h）。
  NodeMetrics metrics = 10;
}

// M7 节点资源指标。静态字段（cpu_name, cores, os 等）随心跳重复发送以容忍 master 重启。
// 动态指标（cpu_usage, ram_used, net_*_bps 等）每次采样上报。
message NodeMetrics {
  // 静态
  string cpu_name = 1;
  uint32 cpu_cores = 2;
  string arch = 3;             // "x86_64" / "aarch64"
  string os = 4;               // "Debian 13" / "Ubuntu 24.04"
  string kernel = 5;           // "6.1.0-25-amd64"
  string virtualization = 6;   // "kvm" / "vmware" / "docker" / "none"

  // 动态
  double cpu_usage = 10;       // 0-100
  uint64 ram_total = 11;       // bytes
  uint64 ram_used = 12;
  uint64 swap_total = 13;
  uint64 swap_used = 14;
  uint64 disk_total = 15;      // bytes (root /)
  uint64 disk_used = 16;
  double load1 = 17;
  double load5 = 18;
  double load15 = 19;
  uint64 net_up_bps = 20;      // 即时上行 bps（采样窗口 ~1s）
  uint64 net_down_bps = 21;
  uint64 net_total_up = 22;    // 系统启动以来累计上行字节
  uint64 net_total_down = 23;
  uint32 tcp_conns = 24;       // ESTABLISHED 数（含转发数据通道）
  uint32 udp_conns = 25;
  uint64 uptime_secs = 26;
  uint32 process_count = 27;
}

// 单条 TCP 会话（每个 forward 入口 accept 的 connection）。
// id 由节点生成（UUID），整个生命周期保持一致：active 期间 closed_at_ms=0，
// 关闭后填 closed_at_ms + close_reason；bytes_in/out 是累计值（不是 delta）。
message SessionEvent {
  string id = 1;
  int64 forward_id = 2;
  string entry_node_id = 3;
  string client_ip = 4;
  uint32 client_port = 5;
  string target_addr = 6;
  repeated string hops_path = 7;   // ["node_a","node_b","node_c"]
  string protocol = 8;             // "tcp" | "udp"
  int64 opened_at_ms = 9;
  int64 closed_at_ms = 10;         // 0 = still active
  uint64 bytes_in = 11;            // 累计字节数（不是 delta）
  uint64 bytes_out = 12;
  string close_reason = 13;        // "" if active; "normal" | "timeout" | "error" | "failover"
}
message HeartbeatReply {
  uint64 server_time = 1;
  string message = 2;
}

// 入口节点 forward 实际 listen 状态（bind 是否成功）。
// node 在 spawn_forward 时预先 probe bind，结果通过 heartbeat 上报，
// master 据此提示 UI 「端口被 OS 层其他进程占用」之类问题。
message ListenerState {
  int64 forward_id = 1;
  uint32 port = 2;
  string protocol = 3; // tcp | udp | tcp+udp
  bool ok = 4;
  string error = 5;    // ok=false 时填错误原因 (EADDRINUSE / Permission denied 等)
  // M4.4 实际转发路径："slow"（用户态 tokio）/ "fast"（内核 nftables DNAT）。
  // 老节点为空字符串 — UI 视为 slow（默认行为）。
  string actual_path = 6;
}

// 单条 forward 的流量累计（自 node 启动以来）。
// bytes_in = 入口节点 accept 的客户端 → 转发链路（上行 = 客户端发出）
// bytes_out = 转发链路 → 写回客户端（下行 = 客户端收到）
message TrafficStat {
  int64 forward_id = 1;
  uint64 bytes_in = 2;
  uint64 bytes_out = 3;
}

message SyncRequest {
  string node_id = 1;
}

// 续签请求。client 用现有 mTLS cert 认证；node_id 必须与 peer cert CN 末段一致。
message RenewCertRequest {
  string node_id = 1;
}
message RenewCertReply {
  string cert_pem = 1;
  string key_pem = 2;
  int64 valid_until_ms = 3; // 新 cert 的 NotAfter 毫秒时间戳
}

message SyncReply {
  repeated ForwardRule forwards = 1;
  repeated NodeAddr nodes = 2; // 全量节点地址表，供节点解析下一跳
}
message NodeAddr {
  string id = 1;
  string addr = 2;       // 节点 DataPlane 可达地址 host:port
  string health = 3;     // healthy | unhealthy | unknown
  uint32 latency_ms = 4; // 最近探测 RTT（0 表示未知）
}

message ForwardRule {
  int64 id = 1;
  uint32 listen_port = 2;
  string protocol = 3;      // tcp | udp | tcp+udp（同端口同时转发两种协议）
  repeated Hop hops = 4;    // 每一跳为一个节点组，组内负载均衡
  string target = 5 [deprecated = true]; // 旧单字符串目标，已被 targets 取代
  bool enabled = 6;
  repeated TargetEndpoint targets = 7; // 出口可达的多个目标，按 target_strategy 选 + failover
  string target_strategy = 8;          // weighted | source_hash | least_conn | latency
  // #39 速率限制（bytes/sec）。0 = 不限。仅入口节点 enforce，多入口 LB 时每节点独立 bucket。
  uint64 rate_in_bps = 9;   // 上行 (客户端 → 入口) 带宽上限
  uint64 rate_out_bps = 10; // 下行 (target → 入口) 带宽上限
  // #27 节点间链路加密开关。"" / "tls" = TLS（默认）；"plain" = TCP 不裹 TLS（同机房）。
  // 仅影响 TCP raw_tunnel；UDP/QUIC 无视该字段，永远 TLS。
  string link_encryption = 11;
  // M4.2 转发路径模式。"auto"（默认）/ "fast" / "slow"。节点据此选择 nftables fast path
  // 还是 tokio user-space。条件不满足时 fast → 自动 fallback slow，节点上报实际路径。
  string path_mode = 12;
}

message TargetEndpoint {
  string addr = 1;   // host:port
  uint32 weight = 2; // 用于加权策略
}

message Hop {
  string strategy = 1;          // weighted | source_hash | least_conn | latency
  repeated HopNode nodes = 2;
}
message HopNode {
  string id = 1;
  uint32 weight = 2;
}

// 节点间数据面：双向流承载透传字节，递归支持 N 跳
service DataPlane {
  rpc Tunnel (stream Chunk) returns (stream Chunk);
  // 探活：节点对外做 TCP connect 计时，用于链路测试
  rpc ProbeReach (ProbeReachRequest) returns (ProbeReachReply);
}

message ProbeReachRequest {
  string addr = 1;        // 目标 host:port
  uint32 timeout_ms = 2;  // 0 = 默认 2000
}
message ProbeReachReply {
  bool ok = 1;
  uint64 latency_ms = 2;  // TCP connect 耗时
  string error = 3;       // 失败原因
}

message Chunk {
  // 仅首帧携带 header，声明本条隧道的去向；其余帧为 data。
  TunnelHeader header = 1;
  bytes data = 2;
}
message TunnelHeader {
  repeated Hop remaining_hops = 1; // 还需经过的节点组（不含当前节点），各跳分布式选路+failover
  string target = 2 [deprecated = true]; // 旧单字符串目标
  string client_ip = 3;           // 客户端源IP，供 source_hash 各跳一致
  int64 forward_id = 4;           // 转发ID，隔离 LB 游标
  uint32 hop_index = 5;           // 当前 hop 序号，隔离 LB 游标
  repeated TargetEndpoint targets = 6; // 出口选择 + failover
  string target_strategy = 7;          // 策略名
  // 非空 → 这是一条 UDP 隧道；该值为入口节点观测到的真实客户端 UDP src ip:port，
  // 出口节点据此维护反向回包 socket 映射。TCP 隧道留空。
  string udp_src_addr = 8;
  // #27 节点间链路加密 — relay 据此决定下一跳是 TLS 还是 plain。"" / "tls" / "plain"。
  string link_encryption = 9;
}
