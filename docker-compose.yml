# P0 验证：master 生成 mTLS 证书写入共享 volume，node 读取后建立 mTLS 心跳
services:
  master:
    build: .
    image: zhuanfa:dev
    command: zhuanfa-master
    environment:
      ZF_LISTEN: "0.0.0.0:7443"
      ZF_CERT_DIR: "/data/certs"
      RUST_LOG: "info"
    ports:
      - "7443:7443"
    volumes:
      - certs:/data/certs

  node:
    image: zhuanfa:dev
    command: zhuanfa-node
    depends_on:
      - master
    environment:
      ZF_MASTER: "https://master:7443"
      ZF_CERT_DIR: "/data/certs"
      ZF_NODE_ID: "node-docker-1"
      RUST_LOG: "info"
    volumes:
      - certs:/data/certs

volumes:
  certs:
